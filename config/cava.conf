[general]
framerate = 60
bars = 42
sensitivity = 100
autosens = 1
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = ~/.cache/music-hud/cava-hud.fifo
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 55

[eq]
1 = 1
2 = 1
3 = 1
4 = 1
